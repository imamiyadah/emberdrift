<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberdrift</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05071a; }
  #game { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberdrift: pilot a salvage skiff with WASD or arrow keys, aim with the mouse, hold click or Space to fire, survive waves of drones and choose an upgrade between waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
